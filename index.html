<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle</title>
    <style>
        .card{
            width:9500px;
            height: 9500px; 
            /* width:500px;
            height:500px; */
            border-radius: 50%;
            border: 2px solid black;
            /* margin-top: -500px; */
            background-image: url(https://cdn.britannica.com/38/111338-050-D23BE7C8/Stars-NGC-290-Hubble-Space-Telescope.jpg);
            animation: rotate 20s infinite linear;
            position: relative; 
           
        } h1{
            position: absolute;
            text-align: center;
            font-size: 500px;
            color:white; 
            top: 3000px;
            left: 3500px;
            z-index: 1;
        }
        @keyframes rotate {
            0%{
                transform: rotate(0deg);
            }
            100%{
               transform: rotate(-360deg);
            }
        }
    </style>
</head>
<body><h1>The Galaxy</h1>
     <div class="card">
     </div>
</body>
</html>
